<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goru - Panel Chofer</title>
  
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #111827; color: #ffffff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; color: #10b981; }
    #map { flex: 1; width: 100%; }
    .panel-chofer { background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 18px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; }
    .btn-servicio { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 10px; }
    .activo { background-color: #10b981; color: white; }
    .inactivo { background-color: #ef4444; color: white; }
    .tarjeta-solicitud { background: #f3f4f6; border-radius: 10px; padding: 12px; margin-top: 10px; display: none; }
    .btn-aceptar { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>GORU</h1>
    <span style="font-size: 0.8rem; background: #374151; padding: 4px 8px; border-radius: 8px;">Modo Chofer</span>
  </header>

  <div id="map"></div>

  <div class="panel-chofer">
    <button id="btn-estado" class="btn-servicio inactivo" onclick="toggleEstado()">Fuera de Servicio (Toca para activar)</button>

    <div id="tarjeta-viaje" class="tarjeta-solicitud">
      <h4>🚗 ¡Nuevo viaje disponible!</h4>
      <p id="info-precio" style="font-size: 1.2rem; font-weight: 800; color: #10b981; margin: 4px 0;"></p>
      <button class="btn-aceptar" onclick="aceptarViaje()">Aceptar Viaje</button>
    </div>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY211Ym94emIzMGlnODQ4c2JrNnFyZG40OCJ9.au_s_1ynUiNDfNP7axIlyg';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-58.3816, -34.6037],
      zoom: 13
    });

    let enServicio = false;
    let viajePendienteId = null;

    function toggleEstado() {
      enServicio = !enServicio;
      const btn = document.getElementById('btn-estado');
      if (enServicio) {
        btn.innerText = "🟢 En Servicio (Buscando viajes...)";
        btn.className = "btn-servicio activo";
        buscarViajes();
      } else {
        btn.innerText = "🔴 Fuera de Servicio (Toca para activar)";
        btn.className = "btn-servicio inactivo";
        document.getElementById('tarjeta-viaje').style.display = 'none';
      }
    }

    async function buscarViajes() {
      if (!enServicio) return;
      try {
        const res = await fetch('/api/viajes/pendientes');
        const data = await res.json();
        if (data.exito && data.viajes.length > 0) {
          const viaje = data.viajes[0];
          viajePendienteId = viaje._id;
          document.getElementById('info-precio').innerText = `$${viaje.precioEstimado} (${viaje.tipoVehiculo})`;
          document.getElementById('tarjeta-viaje').style.display = 'block';
        } else {
          document.getElementById('tarjeta-viaje').style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
      setTimeout(buscarViajes, 4000); // Consulta cada 4 segundos
    }

    async function aceptarViaje() {
      if (!viajePendienteId) return;
      try {
        const res = await fetch('/api/viajes/aceptar', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ viajeId: viajePendienteId, choferId: "66bc3a29e1f0610012345678" })
        });
        const data = await res.json();
        if (data.exito) {
          alert('✅ Viaje aceptado. ¡En camino al origen!');
          document.getElementById('tarjeta-viaje').style.display = 'none';
        }
      } catch (e) {
        alert('Error al aceptar viaje');
      }
    }
  </script>
</body>
</html>
