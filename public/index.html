<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goru - Viajes y Envíos</title>
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #111827;
      color: #ffffff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #10b981;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .panel-cotizador {
      background: #ffffff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    .instruccion {
      font-size: 0.85rem;
      color: #4b5563;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 600;
    }

    .selector-vehiculos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .tarjeta-vehiculo {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
    }

    .tarjeta-vehiculo.seleccionado {
      border-color: #10b981;
      background-color: #ecfdf5;
    }

    .resumen-viaje {
      background: #f9fafb;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .resumen-item span {
      display: block;
      font-size: 0.75rem;
      color: #6b7280;
    }

    .resumen-item strong {
      font-size: 1.1rem;
      color: #111827;
    }

    .btn-solicitar {
      width: 100%;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-solicitar:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>GORU</h1>
    <span id="estado-red" style="font-size: 0.8rem; background: #059669; padding: 4px 8px; border-radius: 8px;">Conectado</span>
  </header>

  <div id="map"></div>

  <div class="panel-cotizador">
    <div class="instruccion" id="instruccion-texto">📍 Tocá el mapa para marcar el punto de ORIGEN</div>

    <div class="selector-vehiculos">
      <div class="tarjeta-vehiculo seleccionado" onclick="seleccionarTipo('Auto', this)">
        <h4>🚗 Auto</h4>
      </div>
      <div class="tarjeta-vehiculo" onclick="seleccionarTipo('Moto', this)">
        <h4>🛵 Moto</h4>
      </div>
      <div class="tarjeta-vehiculo" onclick="seleccionarTipo('Flete', this)">
        <h4>🚚 Flete</h4>
      </div>
    </div>

    <div class="resumen-viaje">
      <div class="resumen-item">
        <span>Distancia</span>
        <strong id="val-distancia">0.0 km</strong>
      </div>
      <div class="resumen-item">
        <span>Tiempo</span>
        <strong id="val-tiempo">0 min</strong>
      </div>
      <div class="resumen-item">
        <span>Precio</span>
        <strong id="val-precio" style="color: #10b981;">$0</strong>
      </div>
    </div>

    <button class="btn-solicitar" id="btn-pedir" disabled onclick="confirmarViaje()">Elegí origen y destino</button>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY211Ym94emIzMGlnODQ4c2JrNnFyZG40OCJ9.au_s_1ynUiNDfNP7axIlyg';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-58.3816, -34.6037],
      zoom: 13
    });

    let origenCoords = null;
    let destinoCoords = null;
    let origenMarker = null;
    let destinoMarker = null;
    let tipoVehiculo = 'Auto';
    let cotizacionActual = null;

    // Manejo de clicks en el mapa para Origen y Destino
    map.on('click', (e) => {
      const coords = { lng: e.lngLat.lng, lat: e.lngLat.lat };

      if (!origenCoords) {
        origenCoords = coords;
        origenMarker = new mapboxgl.Marker({ color: '#10b981' }).setLngLat([coords.lng, coords.lat]).addTo(map);
        document.getElementById('instruccion-texto').innerText = "🏁 Ahora tocá el mapa para marcar el DESTINO";
      } else if (!destinoCoords) {
        destinoCoords = coords;
        destinoMarker = new mapboxgl.Marker({ color: '#ef4444' }).setLngLat([coords.lng, coords.lat]).addTo(map);
        document.getElementById('instruccion-texto').innerText = "✅ Ruta seleccionada. Cotizando...";
        cotizarRuta();
      } else {
        // Reiniciar puntos
        if (origenMarker) origenMarker.remove();
        if (destinoMarker) destinoMarker.remove();
        if (map.getSource('route')) {
          map.removeLayer('route');
          map.removeSource('route');
        }
        origenCoords = coords;
        destinoCoords = null;
        cotizacionActual = null;
        origenMarker = new mapboxgl.Marker({ color: '#10b981' }).setLngLat([coords.lng, coords.lat]).addTo(map);
        document.getElementById('instruccion-texto').innerText = "🏁 Ahora tocá el mapa para marcar el DESTINO";
        resetResumen();
      }
    });

    function seleccionarTipo(tipo, elemento) {
      tipoVehiculo = tipo;
      document.querySelectorAll('.tarjeta-vehiculo').forEach(el => el.classList.remove('seleccionado'));
      elemento.classList.add('seleccionado');
      if (origenCoords && destinoCoords) {
        cotizarRuta();
      }
    }

    async function cotizarRuta() {
      try {
        const respuesta = await fetch('/api/cotizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origen: origenCoords,
            destino: destinoCoords,
            tipoVehiculo
          })
        });

        const data = await respuesta.json();

        if (data.exito) {
          cotizacionActual = data;
          document.getElementById('val-distancia').innerText = `${data.distanciaKm} km`;
          document.getElementById('val-tiempo').innerText = `${data.duracionMin} min`;
          document.getElementById('val-precio').innerText = `$${data.precioEstimado}`;
          
          const btn = document.getElementById('btn-pedir');
          btn.disabled = false;
          btn.innerText = `Pedir Goru (${tipoVehiculo})`;

          dibujarRuta(data.geometriaRuta);
          document.getElementById('instruccion-texto').innerText = "Listo para solicitar tu viaje";
        } else {
          alert('Error al calcular la ruta: ' + data.error);
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    }

    function dibujarRuta(geometria) {
      if (map.getSource('route')) {
        map.getSource('route').setData({
          'type': 'Feature',
          'properties': {},
          'geometry': geometria
        });
      } else {
        map.addSource('route', {
          'type': 'geojson',
          'data': {
            'type': 'Feature',
            'properties': {},
            'geometry': geometria
          }
        });
        map.addLayer({
          'id': 'route',
          'type': 'line',
          'source': 'route',
          'layout': { 'line-join': 'round', 'line-cap': 'round' },
          'paint': { 'line-color': '#10b981', 'line-width': 5 }
        });
      }
    }

    function resetResumen() {
      document.getElementById('val-distancia').innerText = "0.0 km";
      document.getElementById('val-tiempo').innerText = "0 min";
      document.getElementById('val-precio').innerText = "$0";
      const btn = document.getElementById('btn-pedir');
      btn.disabled = true;
      btn.innerText = "Elegí origen y destino";
    }

    async function confirmarViaje() {
      if (!cotizacionActual) return;

      const btn = document.getElementById('btn-pedir');
      btn.disabled = true;
      btn.innerText = "Enviando solicitud...";

      try {
        const respuesta = await fetch('/api/viajes/solicitar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pasajeroId: "66bc3a29e1f0610012345678", // ID de usuario de prueba
            origen: { direccion: "Punto de Origen", lat: origenCoords.lat, lng: origenCoords.lng },
            destino: { direccion: "Punto de Destino", lat: destinoCoords.lat, lng: destinoCoords.lng },
            tipoVehiculo,
            distanciaKm: cotizacionActual.distanciaKm,
            duracionMin: cotizacionActual.duracionMin,
            precioEstimado: cotizacionActual.precioEstimado
          })
        });

        const resData = await respuesta.json();

        if (resData.exito) {
          alert('🎉 ¡Viaje solicitado con éxito! Guardado en la base de datos.');
          btn.innerText = "Buscando chofer asignado...";
        } else {
          alert('Error al solicitar viaje: ' + resData.error);
          btn.disabled = false;
        }
      } catch (error) {
        alert('Error al conectar con la API.');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
