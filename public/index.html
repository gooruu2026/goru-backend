<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gorú - Tu viaje al instante</title>
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  
  <!-- Mapbox Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    :root {
      --goru-blue: #0066FF;
      --goru-blue-dark: #004ECC;
      --bg-gray: #F8FAFC;
      --text-main: #0F172A;
      --text-sub: #64748B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-gray); color: var(--text-main); }

    #app { display: flex; flex-direction: column; width: 100%; height: 100vh; position: relative; }
    
    /* Header Superior con Logo Limpio y Grande */
    header {
      background: #FFFFFF;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      z-index: 20;
      height: 64px;
    }

    .brand-container { display: flex; align-items: center; }
    .brand-logo { height: 44px; width: auto; object-fit: contain; }

    .status-badge { 
      background: rgba(0, 102, 255, 0.08); 
      color: var(--goru-blue); 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 700; 
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }

    /* Mapa con altura fija garantizada para que no se ponga en blanco */
    #map-wrapper { width: 100%; height: 50vh; position: relative; z-index: 1; }
    #map { width: 100%; height: 100%; }

    /* Panel Flotante Estilo Uber / DiDi */
    .booking-panel {
      flex: 1;
      background: #FFFFFF;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 16px 20px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.1);
      z-index: 10;
      overflow-y: auto;
    }

    .input-group { margin-bottom: 8px; }
    .input-label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: 800; margin-bottom: 2px; display: block; }
    
    .mapboxgl-ctrl-geocoder {
      width: 100% !important;
      max-width: none !important;
      background-color: #F1F5F9 !important;
      border-radius: 12px !important;
      box-shadow: none !important;
      border: 1px solid #E2E8F0 !important;
    }
    .mapboxgl-ctrl-geocoder--input { color: var(--text-main) !important; font-size: 14px !important; }

    /* Selección de Vehículo */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .service-card {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .service-card.active { border-color: var(--goru-blue); background: rgba(0, 102, 255, 0.06); }
    .service-card .icon { font-size: 22px; display: block; margin-bottom: 2px; }
    .service-card span { font-size: 12px; font-weight: 800; color: #1E293B; }

    /* Desglose de Tarifa */
    .trip-info { display: flex; justify-content: space-between; background: #F1F5F9; padding: 10px 16px; border-radius: 12px; margin-bottom: 10px; }
    .info-box { text-align: center; }
    .info-box .label { font-size: 10px; color: var(--text-sub); text-transform: uppercase; font-weight: 800; }
    .info-box .val { font-size: 14px; font-weight: 800; color: #0F172A; }
    .info-box .price { color: var(--goru-blue); font-size: 16px; }

    /* Botón de Confirmación */
    .btn-confirm {
      width: 100%;
      background: var(--goru-blue);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="brand-container">
        <!-- Solo se muestra el logo grande sin texto al lado -->
        <img src="/logo.png" alt="Gorú" class="brand-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x44/0066FF/FFFFFF?text=GORU';">
      </div>
      <div class="status-badge">
        <div class="status-dot"></div> Online
      </div>
    </header>

    <!-- Contenedor del mapa con altura garantizada -->
    <div id="map-wrapper">
      <div id="map"></div>
    </div>

    <div class="booking-panel">
      <div class="input-group">
        <span class="input-label">Punto de salida</span>
        <div id="geocoder-origin"></div>
      </div>

      <div class="input-group">
        <span class="input-label">Destino</span>
        <div id="geocoder-destination"></div>
      </div>

      <div class="services-grid">
        <div class="service-card active" onclick="selectVehicle('Auto', 350, this)">
          <span class="icon">🚗</span>
          <span>Auto</span>
        </div>
        <div class="service-card" onclick="selectVehicle('Moto', 200, this)">
          <span class="icon">🛵</span>
          <span>Moto</span>
        </div>
        <div class="service-card" onclick="selectVehicle('Flete', 600, this)">
          <span class="icon">🚚</span>
          <span>Flete</span>
        </div>
      </div>

      <div class="trip-info">
        <div class="info-box">
          <div class="label">Distancia</div>
          <div class="val" id="val-dist">0.0 km</div>
        </div>
        <div class="info-box">
          <div class="label">Tiempo</div>
          <div class="val" id="val-time">0 min</div>
        </div>
        <div class="info-box">
          <div class="label">Estimado</div>
          <div class="val price" id="val-price">$0</div>
        </div>
      </div>

      <button class="btn-confirm" id="btn-request" onclick="confirmBooking()">Ingresá origen y destino</button>
    </div>
  </div>

  <script>
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY204Y2g2bnk3MGExNTJyc2p1bjgwNGszZCJ9.9U322q_xP2B7m8T91sN9DA';
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-58.3816, -34.6037],
      zoom: 13
    });

    // Forzar redimensionado para que cargue el mapa sin pantalla en blanco
    setTimeout(() => { map.resize(); }, 500);

    let originCoords = null;
    let destCoords = null;
    let ratePerKm = 350;
    let estimatedTotal = 0;

    const geocoderOrigin = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿Dónde te buscamos?',
      country: 'ar',
      language: 'es'
    });
    geocoderOrigin.addTo('#geocoder-origin');

    const geocoderDest = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿A dónde vas?',
      country: 'ar',
      language: 'es'
    });
    geocoderDest.addTo('#geocoder-destination');

    geocoderOrigin.on('result', (e) => {
      originCoords = e.result.center;
      calculateTripRoute();
    });

    geocoderDest.on('result', (e) => {
      destCoords = e.result.center;
      calculateTripRoute();
    });

    function selectVehicle(type, rate, element) {
      ratePerKm = rate;
      document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
      if (originCoords && destCoords) calculateTripRoute();
    }

    async function calculateTripRoute() {
      if (!originCoords || !destCoords) return;

      try {
        const res = await fetch('/api/cotizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origen: { lng: originCoords[0], lat: originCoords[1] },
            destino: { lng: destCoords[0], lat: destCoords[1] },
            tipoVehiculo: document.querySelector('.service-card.active span').innerText
          })
        });

        const data = await res.json();

        if (data.exito) {
          estimatedTotal = data.precioEstimado;
          document.getElementById('val-dist').innerText = `${data.distanciaKm} km`;
          document.getElementById('val-time').innerText = `${data.duracionMin} min`;
          document.getElementById('val-price').innerText = `$${data.precioEstimado}`;
          
          const btn = document.getElementById('btn-request');
          btn.innerText = `Confirmar Gorú ($${data.precioEstimado})`;

          const routeGeoJSON = {
            type: 'Feature',
            properties: {},
            geometry: data.geometriaRuta
          };

          if (map.getSource('route')) {
            map.getSource('route').setData(routeGeoJSON);
          } else {
            map.addLayer({
              id: 'route',
              type: 'line',
              source: { type: 'geojson', data: routeGeoJSON },
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#0066FF', 'line-width': 6 }
            });
          }

          const bounds = new mapboxgl.LngLatBounds();
          bounds.extend(originCoords);
          bounds.extend(destCoords);
          map.fitBounds(bounds, { padding: 50 });
        }
      } catch (err) {
        console.error("Error calculando ruta:", err);
      }
    }

    function confirmBooking() {
      if (!originCoords || !destCoords) {
        alert('Por favor selecciona origen y destino.');
        return;
      }
      alert(`¡Viaje solicitado con éxito! Total estimado: $${estimatedTotal}`);
    }
  </script>
</body>
</html>
