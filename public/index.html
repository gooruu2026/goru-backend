<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goru - Pedí tu viaje</title>
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  
  <!-- Mapbox Geocoder (Buscador con Autocompletado) -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    :root {
      --goru-blue: #0066FF;
      --goru-blue-dark: #004ecc;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: white; }

    #app { display: flex; flex-direction: column; height: 100vh; position: relative; }
    
    /* Header con el azul Goru */
    header {
      background: var(--card-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--goru-blue);
      z-index: 10;
    }
    .brand { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .brand span { color: var(--goru-blue); }
    .status-badge { background: rgba(0, 102, 255, 0.2); color: #4d94ff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid var(--goru-blue); }

    /* Mapa en pantalla completa */
    #map { flex: 1; width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; }

    /* Panel inferior flotante */
    .booking-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
    }

    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 11px; text-transform: uppercase; color: #aaa; font-weight: bold; margin-bottom: 4px; display: block; }
    
    .mapboxgl-ctrl-geocoder {
      width: 100% !important;
      max-width: none !important;
      background-color: #2a2a2a !important;
      border-radius: 10px !important;
      box-shadow: none !important;
    }
    .mapboxgl-ctrl-geocoder--input { color: #fff !important; }

    /* Selección de vehículo */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .service-btn {
      background: #2a2a2a;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 10px 5px;
      color: white;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .service-btn.active { border-color: var(--goru-blue); background: rgba(0, 102, 255, 0.15); }
    .service-btn span { display: block; font-size: 12px; font-weight: bold; margin-top: 4px; }

    /* Detalles de la tarifa */
    .trip-details { display: flex; justify-content: space-between; background: #161616; padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; }
    .detail-item { text-align: center; }
    .detail-item .label { font-size: 10px; color: #888; text-transform: uppercase; }
    .detail-item .value { font-size: 15px; font-weight: bold; }
    .detail-item .price { color: var(--goru-blue); }

    /* Botón principal */
    .btn-confirm {
      width: 100%;
      background: var(--goru-blue);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-confirm:hover { background: var(--goru-dark-blue); }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="brand">GORU<span>.</span></div>
      <div class="status-badge">Conectado</div>
    </header>

    <div id="map"></div>

    <div class="booking-panel">
      <div class="input-group">
        <span class="input-label">Punto de partida</span>
        <div id="geocoder-origin"></div>
      </div>

      <div class="input-group">
        <span class="input-label">Destino</span>
        <div id="geocoder-destination"></div>
      </div>

      <div class="services-grid">
        <div class="service-btn active" onclick="selectService('Auto', 350)">
          🚗 <span>Auto</span>
        </div>
        <div class="service-btn" onclick="selectService('Moto', 200)">
          🛵 <span>Moto</span>
        </div>
        <div class="service-btn" onclick="selectService('Flete', 600)">
          🚚 <span>Flete</span>
        </div>
      </div>

      <div class="trip-details">
        <div class="detail-item">
          <div class="label">Distancia</div>
          <div class="value" id="val-dist">0.0 km</div>
        </div>
        <div class="detail-item">
          <div class="label">Tiempo</div>
          <div class="value" id="val-time">0 min</div>
        </div>
        <div class="detail-item">
          <div class="label">Estimado</div>
          <div class="value price" id="val-price">$0</div>
        </div>
      </div>

      <button class="btn-confirm" id="btn-request" onclick="confirmTrip()">Elegí origen y destino</button>
    </div>
  </div>

  <script>
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY204Y2g2bnk3MGExNTJyc2p1bjgwNGszZCJ9.9U322q_xP2B7m8T91sN9DA';
    mapboxgl.accessToken = MAPBOX_TOKEN;

    // Mapa usando el estilo de calles claras para ver el mapa 100% nítido
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-58.3816, -34.6037],
      zoom: 12
    });

    // Corrección para forzar a que el mapa ocupe todo el marco sin pantalla negra
    map.on('load', () => {
      map.resize();
    });

    let originCoord = null;
    let destCoord = null;
    let ratePerKm = 350;
    let calculatedPrice = 0;

    // Buscador de Origen
    const geocoderOrigin = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿Dónde te buscamos?',
      country: 'ar'
    });
    geocoderOrigin.addTo('#geocoder-origin');

    // Buscador de Destino
    const geocoderDest = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿A dónde vas?',
      country: 'ar'
    });
    geocoderDest.addTo('#geocoder-destination');

    geocoderOrigin.on('result', (e) => {
      originCoord = e.result.center;
      updateRoute();
    });

    geocoderDest.on('result', (e) => {
      destCoord = e.result.center;
      updateRoute();
    });

    function selectService(type, rate) {
      ratePerKm = rate;
      document.querySelectorAll('.service-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      if (originCoord && destCoord) updateRoute();
    }

    async function updateRoute() {
      if (!originCoord || !destCoord) return;

      const query = await fetch(
        `https://api.mapbox.com/directions/v5/mapbox/driving/${originCoord[0]},${originCoord[1]};${destCoord[0]},${destCoord[1]}?steps=true&geometries=geojson&access_token=${MAPBOX_TOKEN}`
      );
      const json = await query.json();
      const data = json.routes[0];
      
      const distanceKm = (data.distance / 1000).toFixed(2);
      const durationMin = Math.round(data.duration / 60);
      calculatedPrice = Math.round(distanceKm * ratePerKm + 500);

      document.getElementById('val-dist').innerText = `${distanceKm} km`;
      document.getElementById('val-time').innerText = `${durationMin} min`;
      document.getElementById('val-price').innerText = `$${calculatedPrice}`;
      
      const btn = document.getElementById('btn-request');
      btn.innerText = `Confirmar Pedido ($${calculatedPrice})`;

      // Trazar línea de ruta Azul Goru en el mapa
      const routeGeoJSON = {
        type: 'Feature',
        properties: {},
        geometry: data.geometry
      };

      if (map.getSource('route')) {
        map.getSource('route').setData(routeGeoJSON);
      } else {
        map.addLayer({
          id: 'route',
          type: 'line',
          source: { type: 'geojson', data: routeGeoJSON },
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#0066FF', 'line-width': 6 }
        });
      }

      const bounds = new mapboxgl.LngLatBounds();
      bounds.extend(originCoord);
      bounds.extend(destCoord);
      map.fitBounds(bounds, { padding: 80 });
    }

    function confirmTrip() {
      if (!originCoord || !destCoord) {
        alert('Por favor elegí origen y destino primero.');
        return;
      }
      alert(`¡Viaje solicitado con éxito! Total: $${calculatedPrice}`);
    }
  </script>
</body>
</html>
