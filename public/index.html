<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goru - Pedir Viaje</title>
  
  <!-- Mapbox GL JS CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <!-- Mapbox Geocoder (Buscador de direcciones) -->
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #121212; color: #fff; }

    /* Encabezado */
    header { background: #1f1f1f; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00e676; }
    header h1 { color: #00e676; font-size: 22px; font-weight: bold; letter-spacing: 1px; }
    .status { background: #00e67622; color: #00e676; padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid #00e676; }

    /* Contenedor del Mapa */
    #map { flex: 1; width: 100%; height: 50vh; }

    /* Panel Inferior de Búsqueda y Cotización */
    .panel { background: #1f1f1f; padding: 20px; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; z-index: 10; }

    /* Estilos para los Buscadores de Mapbox */
    .mapboxgl-ctrl-geocoder { width: 100% !important; max-width: none !important; background-color: #2a2a2a !important; color: white !important; border-radius: 10px !important; box-shadow: none !important; border: 1px solid #444 !important; }
    .mapboxgl-ctrl-geocoder--input { color: white !important; font-size: 14px !important; }
    .mapboxgl-ctrl-geocoder--icon { fill: #00e676 !important; }
    .mapboxgl-ctrl-geocoder .suggestions { background-color: #2a2a2a !important; border-radius: 10px; }
    .mapboxgl-ctrl-geocoder .suggestions > li > a { color: #ddd !important; }
    .mapboxgl-ctrl-geocoder .suggestions > .active > a { background-color: #00e676 !important; color: #000 !important; }

    /* Selección de Vehículos */
    .vehiculos { display: flex; gap: 10px; justify-content: space-between; margin-top: 5px; }
    .btn-vehiculo { flex: 1; padding: 10px; border: 1px solid #444; background: #2a2a2a; color: #ccc; border-radius: 10px; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; transition: all 0.2s; }
    .btn-vehiculo.active { border-color: #00e676; background: #00e67622; color: #00e676; }

    /* Resumen de Tarifas */
    .resumen { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px 16px; border-radius: 12px; margin-top: 5px; }
    .resumen-item { text-align: center; }
    .resumen-item span { display: block; font-size: 11px; color: #aaa; }
    .resumen-item strong { font-size: 16px; color: #fff; }
    .resumen-item .precio { font-size: 20px; color: #00e676; font-weight: bold; }

    /* Botón de Confirmación */
    .btn-pedir { width: 100%; padding: 15px; background: #00e676; color: #000; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.2s; }
    .btn-pedir:disabled { background: #444; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>GORU</h1>
    <div class="status">● Pasajero</div>
  </header>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Panel de Control -->
  <div class="panel">
    <label style="font-size: 12px; color: #aaa;">PUNTO DE PARTIDA</label>
    <div id="geocoder-origen"></div>

    <label style="font-size: 12px; color: #aaa;">DESTINO</label>
    <div id="geocoder-destino"></div>

    <!-- Selección de Vehículo -->
    <div class="vehiculos">
      <button class="btn-vehiculo active" onclick="seleccionarVehiculo('Auto', this)">🚗 Auto</button>
      <button class="btn-vehiculo" onclick="seleccionarVehiculo('Moto', this)">🛵 Moto</button>
      <button class="btn-vehiculo" onclick="seleccionarVehiculo('Flete', this)">🚚 Flete</button>
    </div>

    <!-- Estimación de Precio y Tiempo -->
    <div class="resumen">
      <div class="resumen-item">
        <span>Distancia</span>
        <strong id="distancia">- km</strong>
      </div>
      <div class="resumen-item">
        <span>Tiempo</span>
        <strong id="tiempo">- min</strong>
      </div>
      <div class="resumen-item">
        <span>Estimado</span>
        <div class="precio" id="precio">$0</div>
      </div>
    </div>

    <button id="btnSolicitar" class="btn-pedir" disabled onclick="solicitarViaje()">Elegí origen y destino</button>
  </div>

  <script>
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY211Ym94emIzMGlnODQ4c2JrNnFyZG40OCJ9.au_s_1ynUiNDfNP7axIlyg';
    mapboxgl.accessToken = MAPBOX_TOKEN;

    // Inicializar Mapa centrado por defecto
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-58.3816, -34.6037], // Buenos Aires por defecto
      zoom: 12
    });

    let origenCoords = null;
    let destinoCoords = null;
    let origenTexto = "";
    let destinoTexto = "";
    let tipoVehiculoSeleccionado = 'Auto';
    let cotizacionActual = null;

    let markerOrigen = new mapboxgl.Marker({ color: '#00e676' });
    let markerDestino = new mapboxgl.Marker({ color: '#ff1744' });

    // Intento de obtener geolocalización actual del usuario
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14 });
      });
    }

    // Buscador de Origen
    const geocoderOrigen = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿Dónde te buscamos?',
      language: 'es'
    });

    // Buscador de Destino
    const geocoderDestino = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿A dónde vas?',
      language: 'es'
    });

    document.getElementById('geocoder-origen').appendChild(geocoderOrigen.onAdd(map));
    document.getElementById('geocoder-destino').appendChild(geocoderDestino.onAdd(map));

    // Eventos al seleccionar Origen
    geocoderOrigen.on('result', (e) => {
      origenCoords = e.result.center; // [lng, lat]
      origenTexto = e.result.place_name;
      markerOrigen.setLngLat(origenCoords).addTo(map);
      calcularYMostrarRuta();
    });

    // Eventos al seleccionar Destino
    geocoderDestino.on('result', (e) => {
      destinoCoords = e.result.center; // [lng, lat]
      destinoTexto = e.result.place_name;
      markerDestino.setLngLat(destinoCoords).addTo(map);
      calcularYMostrarRuta();
    });

    function seleccionarVehiculo(tipo, elem) {
      document.querySelectorAll('.btn-vehiculo').forEach(b => b.classList.remove('active'));
      elem.classList.add('active');
      tipoVehiculoSeleccionado = tipo;
      if (origenCoords && destinoCoords) {
        calcularYMostrarRuta();
      }
    }

    // Función para pedir cotización al Backend y dibujar la ruta
    async function calcularYMostrarRuta() {
      if (!origenCoords || !destinoCoords) return;

      const payload = {
        origen: { lng: origenCoords[0], lat: origenCoords[1] },
        destino: { lng: destinoCoords[0], lat: destinoCoords[1] },
        tipoVehiculo: tipoVehiculoSeleccionado
      };

      try {
        const response = await fetch('/api/cotizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.exito) {
          cotizacionActual = data;

          // Actualizar UI con precio, distancia y tiempo
          document.getElementById('distancia').innerText = `${data.distanciaKm} km`;
          document.getElementById('tiempo').innerText = `${data.duracionMin} min`;
          document.getElementById('precio').innerText = `$${data.precioEstimado}`;

          const btn = document.getElementById('btnSolicitar');
          btn.disabled = false;
          btn.innerText = `Confirmar Pedido ($${data.precioEstimado})`;

          // Dibujar la ruta en el mapa
          if (map.getSource('route')) {
            map.getSource('route').setData({
              'type': 'Feature',
              'properties': {},
              'geometry': data.geometriaRuta
            });
          } else {
            map.addSource('route', {
              'type': 'geojson',
              'data': {
                'type': 'Feature',
                'properties': {},
                'geometry': data.geometriaRuta
              }
            });

            map.addLayer({
              'id': 'route',
              'type': 'line',
              'source': 'route',
              'layout': { 'line-join': 'round', 'line-cap': 'round' },
              'paint': { 'line-color': '#00e676', 'line-width': 5, 'line-opacity': 0.8 }
            });
          }

          // Ajustar zoom para ver ambos puntos
          const bounds = new mapboxgl.LngLatBounds();
          bounds.extend(origenCoords);
          bounds.extend(destinoCoords);
          map.fitBounds(bounds, { padding: 60 });

        } else {
          alert("Error cotizando ruta: " + data.error);
        }
      } catch (err) {
        console.error("Error al cotizar:", err);
      }
    }

    // Solicitar el viaje al Backend
    async function solicitarViaje() {
      if (!cotizacionActual || !origenCoords || !destinoCoords) return;

      const btn = document.getElementById('btnSolicitar');
      btn.disabled = true;
      btn.innerText = 'Buscando chofer cercano...';

      const pedido = {
        pasajeroId: "pasajero_demo_1",
        origen: { direccion: origenTexto, lat: origenCoords[1], lng: origenCoords[0] },
        destino: { direccion: destinoTexto, lat: destinoCoords[1], lng: destinoCoords[0] },
        tipoVehiculo: tipoVehiculoSeleccionado,
        distanciaKm: cotizacionActual.distanciaKm,
        duracionMin: cotizacionActual.duracionMin,
        precioEstimado: cotizacionActual.precioEstimado
      };

      try {
        const response = await fetch('/api/viajes/solicitar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });

        const data = await response.json();

        if (data.exito) {
          alert('🚀 ¡Viaje solicitado con éxito! Un chofer asignado lo verá en su pantalla.');
        } else {
          alert('Hubo un error al solicitar el viaje.');
          btn.disabled = false;
        }
      } catch (err) {
        alert('Error de conexión al solicitar viaje.');
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
