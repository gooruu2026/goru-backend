<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gorú - Tu viaje al instante</title>
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  
  <!-- Mapbox Geocoder (Buscador con autocompletado) -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    :root {
      --goru-blue: #0066FF;
      --goru-blue-dark: #004ECC;
      --bg-gray: #F8FAFC;
      --text-main: #0F172A;
      --text-sub: #64748B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-gray); color: var(--text-main); }

    #app { display: flex; flex-direction: column; width: 100%; height: 100vh; position: relative; }
    
    /* Header Superior Limpio Estilo Uber */
    header {
      background: #FFFFFF;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      z-index: 20;
      height: 64px;
    }

    .brand-container { display: flex; align-items: center; gap: 10px; }
    .brand-logo { height: 36px; width: auto; object-fit: contain; }
    .brand-title { font-size: 24px; font-weight: 900; color: var(--goru-blue); letter-spacing: -0.5px; }

    .status-badge { 
      background: rgba(0, 102, 255, 0.08); 
      color: var(--goru-blue); 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 700; 
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }

    /* Mapa Contenedor */
    #map-wrapper { position: absolute; top: 64px; bottom: 0; width: 100%; height: calc(100vh - 64px); z-index: 1; }
    #map { width: 100%; height: 100%; }

    /* Panel Flotante Estilo Uber / DiDi */
    .booking-panel {
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      z-index: 10;
      max-width: 480px;
      margin: 0 auto;
    }

    .input-group { margin-bottom: 10px; }
    .input-label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: 800; margin-bottom: 4px; display: block; letter-spacing: 0.5px; }
    
    /* Buscadores estilizados */
    .mapboxgl-ctrl-geocoder {
      width: 100% !important;
      max-width: none !important;
      background-color: #F1F5F9 !important;
      border-radius: 14px !important;
      box-shadow: none !important;
      border: 1px solid #E2E8F0 !important;
    }
    .mapboxgl-ctrl-geocoder--input { color: var(--text-main) !important; font-size: 14px !important; }
    .mapboxgl-ctrl-geocoder--icon-search { fill: var(--goru-blue) !important; }

    /* Tarjetas de Selección de Vehículo (Auto, Moto, Flete) */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
    .service-card {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 6px;
      color: var(--text-main);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .service-card.active { border-color: var(--goru-blue); background: rgba(0, 102, 255, 0.06); }
    .service-card .icon { font-size: 24px; display: block; margin-bottom: 4px; }
    .service-card span { font-size: 13px; font-weight: 800; color: #1E293B; }

    /* Desglose de Tarifa */
    .trip-info { display: flex; justify-content: space-between; background: #F1F5F9; padding: 12px 18px; border-radius: 14px; margin-bottom: 14px; }
    .info-box { text-align: center; }
    .info-box .label { font-size: 10px; color: var(--text-sub); text-transform: uppercase; font-weight: 800; }
    .info-box .val { font-size: 15px; font-weight: 800; color: #0F172A; }
    .info-box .price { color: var(--goru-blue); font-size: 18px; }

    /* Botón de Confirmación Principal */
    .btn-confirm {
      width: 100%;
      background: var(--goru-blue);
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 102, 255, 0.35);
      transition: all 0.2s;
    }
    .btn-confirm:active { background: var(--goru-blue-dark); transform: scale(0.98); }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="brand-container">
        <img src="/logo.png" alt="Gorú Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">Gorú</span>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div> Disponible
      </div>
    </header>

    <div id="map-wrapper">
      <div id="map"></div>
    </div>

    <div class="booking-panel">
      <div class="input-group">
        <span class="input-label">Punto de salida</span>
        <div id="geocoder-origin"></div>
      </div>

      <div class="input-group">
        <span class="input-label">Destino</span>
        <div id="geocoder-destination"></div>
      </div>

      <div class="services-grid">
        <div class="service-card active" onclick="selectVehicle('Auto', 350, this)">
          <span class="icon">🚗</span>
          <span>Auto</span>
        </div>
        <div class="service-card" onclick="selectVehicle('Moto', 200, this)">
          <span class="icon">🛵</span>
          <span>Moto</span>
        </div>
        <div class="service-card" onclick="selectVehicle('Flete', 600, this)">
          <span class="icon">🚚</span>
          <span>Flete</span>
        </div>
      </div>

      <div class="trip-info">
        <div class="info-box">
          <div class="label">Distancia</div>
          <div class="val" id="val-dist">0.0 km</div>
        </div>
        <div class="info-box">
          <div class="label">Tiempo</div>
          <div class="val" id="val-time">0 min</div>
        </div>
        <div class="info-box">
          <div class="label">Estimado</div>
          <div class="val price" id="val-price">$0</div>
        </div>
      </div>

      <button class="btn-confirm" id="btn-request" onclick="confirmBooking()">Ingresá origen y destino</button>
    </div>
  </div>

  <script>
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiZ29ydTIwMjYiLCJhIjoiY211Ym94emIzMGlnODQ4c2JrNnFyZG40OCJ9.au_s_1ynUiNDfNP7axIlyg';
    mapboxgl.accessToken = MAPBOX_TOKEN;

    // Estilo de mapa claro y detallado de alta legibilidad
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-58.3816, -34.6037],
      zoom: 13
    });

    // Corrección para renderizar correctamente el mapa
    map.on('load', () => {
      setTimeout(() => map.resize(), 300);
    });

    let originCoords = null;
    let destCoords = null;
    let ratePerKm = 350;
    let estimatedTotal = 0;

    // Buscador Origen
    const geocoderOrigin = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿Dónde te buscamos?',
      country: 'ar',
      language: 'es'
    });
    geocoderOrigin.addTo('#geocoder-origin');

    // Buscador Destino
    const geocoderDest = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '¿A dónde vas?',
      country: 'ar',
      language: 'es'
    });
    geocoderDest.addTo('#geocoder-destination');

    geocoderOrigin.on('result', (e) => {
      originCoords = e.result.center;
      calculateTripRoute();
    });

    geocoderDest.on('result', (e) => {
      destCoords = e.result.center;
      calculateTripRoute();
    });

    function selectVehicle(type, rate, element) {
      ratePerKm = rate;
      document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
      if (originCoords && destCoords) calculateTripRoute();
    }

    async function calculateTripRoute() {
      if (!originCoords || !destCoords) return;

      try {
        const res = await fetch('/api/cotizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origen: { lng: originCoords[0], lat: originCoords[1] },
            destino: { lng: destCoords[0], lat: destCoords[1] },
            tipoVehiculo: document.querySelector('.service-card.active span').innerText
          })
        });

        const data = await res.json();

        if (data.exito) {
          estimatedTotal = data.precioEstimado;
          document.getElementById('val-dist').innerText = `${data.distanciaKm} km`;
          document.getElementById('val-time').innerText = `${data.duracionMin} min`;
          document.getElementById('val-price').innerText = `$${data.precioEstimado}`;
          
          const btn = document.getElementById('btn-request');
          btn.innerText = `Confirmar Gorú ($${data.precioEstimado})`;

          // Dibujar ruta en Azul Gorú
          const routeGeoJSON = {
            type: 'Feature',
            properties: {},
            geometry: data.geometriaRuta
          };

          if (map.getSource('route')) {
            map.getSource('route').setData(routeGeoJSON);
          } else {
            map.addLayer({
              id: 'route',
              type: 'line',
              source: { type: 'geojson', data: routeGeoJSON },
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#0066FF', 'line-width': 6 }
            });
          }

          const bounds = new mapboxgl.LngLatBounds();
          bounds.extend(originCoords);
          bounds.extend(destCoords);
          map.fitBounds(bounds, { padding: 60 });
        }
      } catch (err) {
        console.error("Error calculando ruta:", err);
      }
    }

    function confirmBooking() {
      if (!originCoords || !destCoords) {
        alert('Por favor selecciona origen y destino.');
        return;
      }
      alert(`¡Viaje solicitado con éxito! Total estimado: $${estimatedTotal}`);
    }
  </script>
</body>
</html>
